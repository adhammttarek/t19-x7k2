<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9f5ed;--card:#fff;--ink:#12283d;--soft:#5f7a72;--line:#c5ddd0;--acc:#1c7a4c;--her:#3fae78;--us:#2f4b7c;--joke:#e9a63f;--me:#e5705a;--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,sans-serif}

:root[data-theme="dark"]{--bg:#0a1f19;--card:#11302a;--ink:#eaf5ee;--soft:#93b5a8;--line:#22493d;--acc:#6fd3a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;text-align:center;min-height:100vh}
.wrap{max-width:540px;margin:0 auto;padding:24px 20px 56px}
h1{font-family:var(--serif);font-weight:500;font-size:2.6rem;margin:.3em 0;letter-spacing:.01em}
.sub{color:var(--soft);line-height:1.7}
.bunting{width:100%;display:block;margin-bottom:4px}
.n19{font-family:var(--serif);font-size:8.5rem;line-height:1;color:var(--acc);font-weight:400;margin-top:10px}
.eyebrow{margin-top:8vh;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.big{border:1px solid var(--ink);padding:13px 34px;margin-top:22px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;transition:.25s}
.big:hover{background:var(--ink);color:var(--bg)}
.big.sm{padding:9px 22px;font-size:.7rem;margin-top:6px}
#board{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin:10px 0 26px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 12px;padding-bottom:16px}
.b{aspect-ratio:.86;background:color-mix(in srgb,var(--c) 20%,var(--card));border:1px solid var(--c);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;font-family:var(--serif);font-size:1.6rem;position:relative;transition:.25s;margin-bottom:14px}
.b:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--c)}
.b:hover{transform:translateY(-5px)}
.b.done{opacity:.45}
.her{--c:var(--her)}.us{--c:var(--us)}.joke{--c:var(--joke)}.me{--c:var(--me)}
#modal{position:fixed;inset:0;background:rgba(8,16,30,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{background:var(--card);padding:34px 26px;max-width:420px;width:100%;max-height:85vh;overflow:auto;animation:fd .4s}
@keyframes fd{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tag{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);border-left:3px solid var(--c);padding-left:9px}
.card h2{font-variant-numeric:lining-nums;font-family:var(--serif);font-weight:500;font-size:2rem;margin:.6em 0 .3em}
.card p{white-space:pre-line;line-height:1.75}
.ph{border:1px dashed var(--acc);padding:12px;color:var(--soft);font-size:.85rem}
.shake{font-family:var(--serif);font-size:2rem;font-weight:600;color:var(--acc);animation:sh .5s infinite}
@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
.dict{text-align:left;border-left:2px solid var(--line);padding:4px 14px;line-height:1.7;font-family:var(--serif);font-size:1.15rem}
.conf{position:fixed;top:-20px;width:7px;height:11px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
